# Entorno independiente para los ejercicios de PostgreSQL.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: empresa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Practica123
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - datos_empresa:/var/lib/postgresql/data
      - ./ejercicios_practicos.sql:/docker-entrypoint-initdb.d/01-ejercicios.sql:ro

volumes:
  datos_empresa:
